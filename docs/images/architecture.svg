<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
<title id="title">SNP Depot Management — System Architecture</title><desc id="desc">Angular communicates with a layered ASP.NET Core API. Application handlers use Domain rules and Infrastructure adapters for PostgreSQL and Redis. A migration task completes before API startup. Dashed arrows distinguish source dependencies from runtime flow.</desc>
