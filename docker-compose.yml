# Local development/demo only. Use docker-compose.prod.yml for production.
name: snp-depot
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-snp_depot_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-snp_depot_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    restart: "no"
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Database=${POSTGRES_DB:-snp_depot_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-snp_depot_db}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      MIGRATION_MODE: fresh
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    ports:
      - "127.0.0.1:${API_PORT:-5000}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Database=${POSTGRES_DB:-snp_depot_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379,abortConnect=false,connectTimeout=2000,asyncTimeout=2000
      Redis__Required: "false"
      Jwt__Secret: ${JWT_SECRET:?Set JWT_SECRET with at least 32 characters}
      Jwt__Issuer: ${JWT_ISSUER:-SnpDepotManagement}
      Jwt__Audience: ${JWT_AUDIENCE:-SnpDepotManagementUsers}
      Admin__TenantId: ${ADMIN_TENANT_ID:-DEPOT-A}
      Admin__UserName: ${ADMIN_USERNAME:-admin}
      Admin__Password: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      Depot__Name: ${DEPOT_NAME:-SNP Depot}
      Depot__Timezone: ${DEPOT_TIMEZONE:-Asia/Ho_Chi_Minh}
      Seed__DemoData: ${SEED_DEMO_DATA:-false}
      Seed__UserPassword: ${SEED_USER_PASSWORD:-}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN:-http://localhost:4200}
      Transport__UseHttpsRedirection: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
